[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wirecf"
version = "3.0.0"
description = "Wire-Valid Counterfactual Flows for Encrypted Traffic Classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Amr H. Abdelhaliem", email = "amr@irbid-nu.edu.jo" }
]
keywords = ["encrypted-traffic", "counterfactual", "explainable-ai", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "einops>=0.8",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "kaggle>=1.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "black>=24", "ruff>=0.5"]

[project.scripts]
wirecf-run = "wirecf.cli:main"

[project.urls]
Homepage = "https://github.com/amrogomma-web/wirecf-v3"
Repository = "https://github.com/amrogomma-web/wirecf-v3"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
